name: Validate

on:
  workflow_call:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows and actions
        uses: hononeko/actions/lint-actions@v1

      - name: Lint Dockerfile
        uses: hononeko/actions/lint-docker@v1

      - name: Lint Go
        uses: hononeko/actions/lint-go@v1

      - name: Run unit tests with coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      # Overall coverage is reported; a pull request's changed lines must be 80% covered.
      - name: Coverage
        uses: hononeko/actions/coverage@v1
        with:
          files: coverage.out
          min-changed-coverage: "80"
