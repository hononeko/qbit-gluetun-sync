name: Snapshot Cleanup

# Deletes a pull request's snapshot images (pr-<PR>, pr-<PR>-sha-<commit>) once it's closed, merged or not. Only
# branches of this repository get snapshots, and only their pull requests get a token that can delete packages.
on:
  pull_request:
    types: [closed]

jobs:
  prune:
    name: Prune Snapshots
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prune
        uses: hononeko/actions/prune-snapshots@3898710c9118a72c6d5a7fcedeaea0156469abd8 # v1.3.0
        with:
          package: qbit-gluetun-sync
          pr-number: ${{ github.event.pull_request.number }}
