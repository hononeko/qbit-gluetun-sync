name: Image

# Builds the image natively on an amd64 and an arm64 runner (no QEMU), smoke tests each one, and, with `push`, pushes
# each to GHCR by digest. main.yml combines the digests into one multi-arch release candidate.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; empty for the event's own (a pull request's snapshot builds its head commit)
        type: string
        default: ""
      push:
        description: Push each architecture's image to GHCR by digest and upload the digests as artifacts
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qbit-gluetun-sync

jobs:
  build:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # What both callers grant: read the code, push images when `push` is set.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: smoke:${{ matrix.arch }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      # With no configuration it can't reach qBittorrent, but the server still answers its liveness probe.
      - name: Smoke test
        uses: hononeko/actions/smoke-test@5901cfe081dabc5c46c5c331115a5c9f97af2f31 # v1.3.2
        with:
          image: smoke:${{ matrix.arch }}
          port: "9090"
          path: /healthz
          status: "200"
          max-memory-mib: "32"

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
