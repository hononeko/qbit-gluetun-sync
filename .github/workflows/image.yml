name: Image

# Builds the image natively on an amd64 and an arm64 runner (no QEMU), smoke tests each one, and, with `push`, pushes
# each to GHCR by digest. main.yml combines the digests into one multi-arch release candidate.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; empty for the event's own (a pull request's snapshot builds its head commit)
        type: string
        default: ""
      push:
        description: Push each architecture's image to GHCR by digest and upload the digests as artifacts
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qbit-gluetun-sync

jobs:
  build:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # What both callers grant: read the code, push images when `push` is set.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for the smoke test
        uses: hononeko/actions/build-image@v1
        with:
          platforms: linux/${{ matrix.arch }}
          tags: smoke:${{ matrix.arch }}
          cache-scope: image-${{ matrix.arch }}

      # With no configuration it can't reach qBittorrent, but the server still answers its liveness probe.
      - name: Smoke test
        uses: hononeko/actions/smoke-test@v1
        with:
          image: smoke:${{ matrix.arch }}
          port: "9090"
          path: /healthz
          status: "200"
          max-memory-mib: "32"

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        if: inputs.push
        uses: hononeko/actions/build-image@v1
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          platforms: linux/${{ matrix.arch }}
          push: "true"
          cache-scope: image-${{ matrix.arch }}
          cache-write: "false"
          digest-artifact: digests-${{ matrix.arch }}
