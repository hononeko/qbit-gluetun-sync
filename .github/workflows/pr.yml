name: PR Validation

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  # Both architectures, built and smoke-tested without pushing.
  image:
    needs: validate
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
