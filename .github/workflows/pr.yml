name: PR Validation

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  # The snapshot's name, after the pull request's head commit.
  version:
    needs: validate
    uses: ./.github/workflows/version.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read

  # Both architectures, built and smoke-tested. With the snapshot label, on a branch of this repository (never a fork's,
  # whose code mustn't run with a token that can push), the branch's head commit is built and pushed by digest.
  image:
    needs: [validate, version]
    uses: ./.github/workflows/image.yml
    with:
      push: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
      ref: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'snapshot')
        && github.event.pull_request.head.sha || '' }}
    permissions:
      contents: read
      packages: write

  # Joins the pushed images into a multi-arch snapshot, tagged pr-<PR>-sha-<commit> and pr-<PR> (the newest), and keeps
  # a comment on the pull request naming it. snapshot-cleanup.yml deletes the snapshots when the pull request closes.
  snapshot:
    name: Publish Snapshot
    needs: [version, image]
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      attestations: write
      id-token: write
      pull-requests: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch snapshot
        uses: hononeko/actions/publish-image@82e06071aa2d62f9ed1776639e436238cd66666a # v1.6.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/qbit-gluetun-sync
          tags: |
            ${{ needs.version.outputs.snapshot_tag }}
            pr-${{ github.event.pull_request.number }}
          expected-digests: "2"
          title: Snapshot
          comment-on-pr: ${{ github.event.pull_request.number }}
          comment-note: For testing only, never for the gitops repository. Deleted when this pull request closes.
