name: Main Validation

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qbit-gluetun-sync

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read

  # Both architectures' images, built and smoke-tested on every push to main. When there's something to release,
  # they're pushed by digest for the release candidate below.
  image:
    needs: [validate, version]
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ needs.version.outputs.version_type != 'none' }}
    permissions:
      contents: read
      packages: write

  # Joins both architectures into one multi-arch release candidate. cd.yml later promotes this exact image (by its
  # commit tag) to the stable version; `latest` is never touched here.
  release-candidate:
    name: Publish Release Candidate
    needs: [version, image]
    if: needs.version.outputs.version_type != 'none'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qbit-gluetun-sync
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch release candidate
        uses: hononeko/actions/publish-image@v1
        with:
          image: ${{ env.IMAGE }}
          tags: |
            ${{ needs.version.outputs.rc_version }}
            ${{ needs.version.outputs.commit_tag }}
            edge
          expected-digests: "2"
          title: Release candidate published
